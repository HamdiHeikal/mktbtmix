<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير طباعة ملفات PDF المجمع (نسخة الصور الآمنة)</title>
    <!-- مكتبة قراءة وعرض ملفات PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select, input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219653;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 12px;
            background: #e8f8f5;
            border: 1px solid #a3e4d7;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        #fileList {
            margin-top: 10px;
            max-height: 120px;
            overflow-y: auto;
            background: #fafafa;
            border: 1px solid #eee;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>أداة طباعة ملفات PDF (تحويل إلى صور لمنع المربعات)</h2>
    
    <div class="form-group">
        <label for="pdfFiles">1. اختر ملفات PDF:</label>
        <input type="file" id="pdfFiles" accept="application/pdf" multiple>
        <div id="fileList">لم يتم اختيار أي ملفات بعد.</div>
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

    <h3>خيارات الطباعة:</h3>
    
    <div class="form-group">
        <label for="orientation">اتجاه الصفحة:</label>
        <select id="orientation">
            <option value="portrait">رأسي (Portrait)</option>
            <option value="landscape">أفقي (Landscape)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="duplex">الطباعة على الوجهين:</label>
        <select id="duplex">
            <option value="simplex">وجه واحد (Single Sided)</option>
            <option value="long-edge">وجه وظهر - القلب عند الحافة الطويلة (Duplex Long Edge)</option>
            <option value="short-edge">وجه وظهر - القلب عند الحافة القصيرة (Duplex Short Edge)</option>
        </select>
    </div>

    <div class="form-group">
        <div class="checkbox-group">
            <input type="checkbox" id="bookletMode">
            <label for="bookletMode" style="margin-bottom:0; cursor:pointer;">طباعة بوكليت (كتيب - الصفحة الأولى تقابل الأخيرة وهكذا)</label>
        </div>
    </div>

    <div class="form-group" id="bookletDirGroup" style="display:none;">
        <label for="bookletDirection">اتجاه فتح البوكليت:</label>
        <select id="bookletDirection">
            <option value="rtl">يفتح من اليمين (للغة العربية)</option>
            <option value="ltr">يفتح من اليسار (للغة الإنجليزية)</option>
        </select>
    </div>

    <button id="printBtn" onclick="startBatchPrint()">بدء المعالجة والطباعة الآمنة</button>
    
    <div id="status">جاري المعالجة...</div>
</div>

<script>
    const fileInput = document.getElementById('pdfFiles');
    const fileListDiv = document.getElementById('fileList');
    const bookletCheckbox = document.getElementById('bookletMode');
    const bookletDirGroup = document.getElementById('bookletDirGroup');
    const printBtn = document.getElementById('printBtn');
    const statusDiv = document.getElementById('status');

    let selectedFiles = [];

    bookletCheckbox.addEventListener('change', function() {
        bookletDirGroup.style.display = this.checked ? 'block' : 'none';
    });

    fileInput.addEventListener('change', function(e) {
        selectedFiles = Array.from(e.target.files);
        if (selectedFiles.length > 0) {
            let html = '<ul>';
            selectedFiles.forEach(file => {
                html += `<li>${file.name}</li>`;
            });
            html += '</ul>';
            fileListDiv.innerHTML = html;
        } else {
            fileListDiv.innerHTML = 'لم يتم اختيار أي ملفات بعد.';
        }
    });

    function generateBookletOrder(numPages, direction) {
        let remainder = numPages % 4;
        let totalPages = numPages;
        if (remainder !== 0) {
            totalPages += (4 - remainder);
        }

        let pages = [];
        for (let i = 1; i <= totalPages; i++) {
            pages.push(i <= numPages ? i : null);
        }

        let bookletPages = [];
        let left = 0;
        let right = totalPages - 1;

        while (left < right) {
            if (direction === 'rtl') {
                bookletPages.push(pages[left]);
                bookletPages.push(pages[right]);
            } else {
                bookletPages.push(pages[right]);
                bookletPages.push(pages[left]);
            }
            left++;
            right--;
        }
        return bookletPages.filter(p => p !== null);
    }

    async function printPdfFile(file, options) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = async function(e) {
                const typedarray = new Uint8Array(e.target.result);
                try {
                    const loadingTask = pdfjsLib.getDocument(typedarray);
                    const pdfDoc = await loadingTask.promise;
                    const numPages = pdfDoc.numPages;

                    const iframe = document.createElement('iframe');
                    iframe.style.position = 'fixed';
                    iframe.style.right = '0';
                    iframe.style.bottom = '0';
                    iframe.style.width = '0';
                    iframe.style.height = '0';
                    iframe.style.border = '0';
                    document.body.appendChild(iframe);

                    const doc = iframe.contentWindow.document;
                    doc.open();
                    doc.write('<html><head><title>طباعة</title><style>');
                    doc.write(`@page { size: ${options.orientation}; margin: 5mm; }`);
                    doc.write('body { margin: 0; background: #fff; text-align: center; }');
                    doc.write('.page { page-break-after: always; display: flex; justify-content: center; align-items: center; height: 100vh; }');
                    doc.write('img { max-width: 100%; max-height: 100%; object-fit: contain; }');
                    doc.write('</style></head><body>');

                    let pagesToPrint = [];
                    if (options.booklet) {
                        pagesToPrint = generateBookletOrder(numPages, options.bookletDir);
                    } else {
                        for (let i = 1; i <= numPages; i++) pagesToPrint.push(i);
                    }

                    for (let pageNum of pagesToPrint) {
                        const page = await pdfDoc.getPage(pageNum);
                        // ضبط الدقة على 2.0 لضمان وضوح الحروف والصور تماماً عند الطباعة
                        const viewport = page.getViewport({ scale: 2.0 }); 
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        
                        // تحويل الصفحة حصرياً إلى صورة بتنسيق PNG للحفاظ على الخطوط سليمة
                        const imgDataUrl = canvas.toDataURL('image/png');

                        const div = doc.createElement('div');
                        div.className = 'page';
                        const img = doc.createElement('img');
                        img.src = imgDataUrl;
                        div.appendChild(img);
                        doc.body.appendChild(div);
                    }

                    doc.close();

                    setTimeout(() => {
                        iframe.contentWindow.focus();
                        iframe.contentWindow.print();
                        
                        setTimeout(() => {
                            document.body.removeChild(iframe);
                            resolve();
                        }, 2500);
                    }, 1000);

                } catch (err) {
                    console.error(err);
                    reject(err);
                }
            };
            reader.readAsArrayBuffer(file);
        });
    }

    async function startBatchPrint() {
        if (selectedFiles.length === 0) {
            alert('الرجاء اختيار ملفات PDF أولاً.');
            return;
        }

        const options = {
            orientation: document.getElementById('orientation').value,
            duplex: document.getElementById('duplex').value,
            booklet: bookletCheckbox.checked,
            bookletDir: document.getElementById('bookletDirection').value
        };

        printBtn.disabled = true;
        statusDiv.style.display = 'block';

        for (let i = 0; i < selectedFiles.length; i++) {
            statusDiv.innerText = `جاري تحويل وطباعة الملف (${i + 1} من ${selectedFiles.length}): ${selectedFiles[i].name}`;
            try {
                await printPdfFile(selectedFiles[i], options);
            } catch (e) {
                console.error("خطأ في طباعة الملف:", selectedFiles[i].name);
            }
        }

        statusDiv.innerText = 'تم الانتهاء من طباعة جميع الملفات بنجاح!';
        printBtn.disabled = false;
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 4000);
    }
</script>

</body>
</html>
