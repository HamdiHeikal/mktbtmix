<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة طباعة بوكليت PDF الاحترافية</title>
    <!-- مكتبة قراءة وعرض ملفات PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select, input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219653;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 12px;
            background: #e8f8f5;
            border: 1px solid #a3e4d7;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        #fileList {
            margin-top: 10px;
            max-height: 120px;
            overflow-y: auto;
            background: #fafafa;
            border: 1px solid #eee;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .note {
            font-size: 12px;
            color: #e67e22;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>أداة طباعة بوكليت PDF (صفحتين بالورقة - وجه وظهر)</h2>
    
    <div class="form-group">
        <label for="pdfFiles">1. اختر ملفات PDF:</label>
        <input type="file" id="pdfFiles" accept="application/pdf" multiple>
        <div id="fileList">لم يتم اختيار أي ملفات بعد.</div>
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

    <h3>خيارات الطباعة:</h3>
    
    <div class="form-group">
        <label for="orientation">اتجاه الورقة (مُفضل أفقي للبوكليت):</label>
        <select id="orientation">
            <option value="landscape">أفقي (Landscape)</option>
            <option value="portrait">رأسي (Portrait)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="duplex">الطباعة على الوجهين:</label>
        <select id="duplex">
            <option value="long-edge">وجه وظهر - القلب عند الحافة الطويلة (موصى به)</option>
            <option value="short-edge">وجه وظهر - القلب عند الحافة القصيرة</option>
            <option value="simplex" id="simplexOpt">وجه واحد (سيتم إلغاؤه تلقائياً عند تفعيل البوكليت)</option>
        </select>
    </div>

    <div class="form-group">
        <div class="checkbox-group">
            <input type="checkbox" id="bookletMode" checked>
            <label for="bookletMode" style="margin-bottom:0; cursor:pointer;">تفعيل طباعة نظام البوكليت (الكراسة)</label>
        </div>
        <div class="note">عند تفعيل البوكليت، يتم دمج صفحتين معاً في الورقة وتنسيق الوجوه والظهر تلقائياً.</div>
    </div>

    <div class="form-group" id="bookletDirGroup">
        <label for="bookletDirection">اتاه التجميع (اللغة / طريقة القراءة):</label>
        <select id="bookletDirection">
            <option value="rtl">من اليمين لليسار (للغة العربية - مثل مثالك)</option>
            <option value="ltr">من اليسار لليمين (للغة الإنجليزية)</option>
        </select>
    </div>

    <button id="printBtn" onclick="startBatchPrint()">بدء طباعة البوكليت دفعة واحدة</button>
    
    <div id="status">جاري المعالجة...</div>
</div>

<script>
    const fileInput = document.getElementById('pdfFiles');
    const fileListDiv = document.getElementById('fileList');
    const bookletCheckbox = document.getElementById('bookletMode');
    const bookletDirGroup = document.getElementById('bookletDirGroup');
    const duplexSelect = document.getElementById('duplex');
    const printBtn = document.getElementById('printBtn');
    const statusDiv = document.getElementById('status');

    let selectedFiles = [];

    // إجبار الوجهين عند تفعيل البوكليت
    function updateBookletUI() {
        if (bookletCheckbox.checked) {
            bookletDirGroup.style.display = 'block';
            duplexSelect.value = 'long-edge';
            duplexSelect.disabled = true; // إجبار واختيار تلقائي
        } else {
            bookletDirGroup.style.display = 'none';
            duplexSelect.disabled = false;
        }
    }

    bookletCheckbox.addEventListener('change', updateBookletUI);
    window.addEventListener('DOMContentLoaded', updateBookletUI);

    fileInput.addEventListener('change', function(e) {
        selectedFiles = Array.from(e.target.files);
        if (selectedFiles.length > 0) {
            let html = '<ul>';
            selectedFiles.forEach(file => {
                html += `<li>${file.name}</li>`;
            });
            html += '</ul>';
            fileListDiv.innerHTML = html;
        } else {
            fileListDiv.innerHTML = 'لم يتم اختيار أي ملفات بعد.';
        }
    });

    // توليد أزواج صفحات البوكليت (كل عنصر عبارة عن ورقة تحتوي على [صفحة يسرى، صفحة يمنى])
    // لكي تطابق تماماً مثالك المكون من 8 صفحات
    function generateBookletSheets(numPages, direction) {
        let remainder = numPages % 4;
        let totalPages = numPages;
        if (remainder !== 0) {
            totalPages += (4 - remainder); // إكمال الملف لمضاعفات العدد 4 بصفحات فارغة (null)
        }

        let pages = [];
        for (let i = 1; i <= totalPages; i++) {
            pages.push(i <= numPages ? i : null); 
        }

        let sheets = [];
        let left = 0;
        let right = totalPages - 1;

        while (left < right) {
            // كل ورقة لها وجهان: (وجه أمامي ووجه خلفي) أو نتحكم في الترتيب المظبوط للملزمة
            sheets.push({
                leftPage: pages[left],   // الصفحة الخارجية يسار
                rightPage: pages[right]  // الصفحة الخارجية يمين
            });
            left++;
            right--;
        }

        // إعادة ترتيب الأوراق لتناسب الطباعة المزدوجة (Duplex Printing Sheets Pairs)
        // الطريقة الصحيحة لملزمة كراسة متسلسلة:
        let bookletSheetsFinal = [];
        let numSheets = sheets.length;
        
        for (let i = 0; i < numSheets / 2; i++) {
            let outerFront, outerBack;
            if (direction === 'rtl') {
                // للغة العربية: الوجوه الخارجية والداخلية
                // الورقة الأولى: الوش (قبل الأخير والأول عكساً) حسب معمارية ملازم الطباعة
                outerFront = { left: sheets[numSheets - 1 - i].rightPage, right: sheets[i].leftPage }; // مثال: صفحة 2 و 7
                outerBack  = { left: sheets[i].rightPage, right: sheets[numSheets - 1 - i].leftPage };  // مثال: صفحة 1 و 8
            } else {
                outerFront = { left: sheets[i].leftPage, right: sheets[numSheets - 1 - i].rightPage };
                outerBack  = { left: sheets[numSheets - 1 - i].leftPage, right: sheets[i].rightPage };
            }
            bookletSheetsFinal.push(outerFront); // الوش
            bookletSheetsFinal.push(outerBack);  // الظهر
        }

        return bookletSheetsFinal;
    }

    async function printPdfFile(file, options) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = async function(e) {
                const typedarray = new Uint8Array(e.target.result);
                try {
                    const loadingTask = pdfjsLib.getDocument(typedarray);
                    const pdfDoc = await loadingTask.promise;
                    const numPages = pdfDoc.numPages;

                    const iframe = document.createElement('iframe');
                    iframe.style.position = 'fixed';
                    iframe.style.right = '0';
                    iframe.style.bottom = '0';
                    iframe.style.width = '0';
                    iframe.style.height = '0';
                    iframe.style.border = '0';
                    document.body.appendChild(iframe);

                    const doc = iframe.contentWindow.document;
                    doc.open();
                    doc.write('<html><head><title>طباعة بوكليت</title><style>');
                    doc.write(`@page { size: ${options.orientation}; margin: 2mm; }`);
                    doc.write('body { margin: 0; background: #fff; text-align: center; }');
                    doc.write('.sheet { page-break-after: always; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; box-sizing: border-box; }');
                    doc.write('.page-box { display: flex; width: 100%; height: 100%; justify-content: center; align-items: center; }');
                    doc.write('.half { width: 50%; height: 100%; display: flex; justify-content: center; align-items: center; }');
                    doc.write('img { max-width: 100%; max-height: 100%; object-fit: contain; }');
                    doc.write('</style></head><body>');

                    let printUnits = [];
                    if (options.booklet) {
                        printUnits = generateBookletSheets(numPages, options.bookletDir);
                    } else {
                        // طباعة عادية صفحة صفحة
                        for (let i = 1; i <= numPages; i++) {
                            printUnits.push({ leftPage: null, rightPage: i });
                        }
                    }

                    for (let unit of printUnits) {
                        const sheetDiv = doc.createElement('div');
                        sheetDiv.className = 'sheet';
                        const boxDiv = doc.createElement('div');
                        boxDiv.className = 'page-box';

                        // دالة مساعدة لتقديم ورسم الصفحة على الكانفاس وتحويلها لصورة
                        async function renderPageToImage(pageNum) {
                            if (pageNum === null) {
                                const emptyCanvas = doc.createElement('canvas');
                                emptyCanvas.width = 500; emptyCanvas.height = 700;
                                return emptyCanvas.toDataURL('image/png');
                            }
                            const page = await pdfDoc.getPage(pageNum);
                            const viewport = page.getViewport({ scale: 1.5 });
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d');
                            canvas.height = viewport.height;
                            canvas.width = viewport.width;
                            await page.render({ canvasContext: context, viewport: viewport }).promise;
                            return canvas.toDataURL('image/png');
                        }

                        if (options.booklet) {
                            // دمج صفحتين جنباً إلى جنب في نفس الورقة (نظام بوستر)
                            const leftDataUrl = await renderPageToImage(unit.leftPage);
                            const rightDataUrl = await renderPageToImage(unit.rightPage);

                            const leftHalf = doc.createElement('div');
                            leftHalf.className = 'half';
                            if (unit.leftPage !== null) {
                                const imgL = doc.createElement('img');
                                imgL.src = leftDataUrl;
                                leftHalf.appendChild(imgL);
                            }

                            const rightHalf = doc.createElement('div');
                            rightHalf.className = 'half';
                            if (unit.rightPage !== null) {
                                const imgR = doc.createElement('img');
                                imgR.src = rightDataUrl;
                                rightHalf.appendChild(imgR);
                            }

                            boxDiv.appendChild(leftHalf);
                            boxDiv.appendChild(rightHalf);
                        } else {
                            // طباعة عادية صفحة مفردة
                            const pageDataUrl = await renderPageToImage(unit.rightPage);
                            const singleHalf = doc.createElement('div');
                            singleHalf.className = 'half';
                            singleHalf.style.width = '100%';
                            const imgS = doc.createElement('img');
                            imgS.src = pageDataUrl;
                            singleHalf.appendChild(imgS);
                            boxDiv.appendChild(singleHalf);
                        }

                        sheetDiv.appendChild(boxDiv);
                        doc.body.appendChild(sheetDiv);
                    }

                    doc.close();

                    setTimeout(() => {
                        iframe.contentWindow.focus();
                        iframe.contentWindow.print();
                        
                        setTimeout(() => {
                            document.body.removeChild(iframe);
                            resolve();
                        }, 3000);
                    }, 1500);

                } catch (err) {
                    console.error(err);
                    reject(err);
                }
            };
            reader.readAsArrayBuffer(file);
        });
    }

    async function startBatchPrint() {
        if (selectedFiles.length === 0) {
            alert('الرجاء اختيار ملفات PDF أولاً.');
            return;
        }

        const options = {
            orientation: document.getElementById('orientation').value,
            duplex: document.getElementById('duplex').value,
            booklet: bookletCheckbox.checked,
            bookletDir: document.getElementById('bookletDirection').value
        };

        printBtn.disabled = true;
        statusDiv.style.display = 'block';

        for (let i = 0; i < selectedFiles.length; i++) {
            statusDiv.innerText = `جاري تجهيز وطباعة البوكليت (${i + 1} من ${selectedFiles.length}): ${selectedFiles[i].name}`;
            try {
                await printPdfFile(selectedFiles[i], options);
            } catch (e) {
                console.error("خطأ في طباعة الملف:", selectedFiles[i].name);
            }
        }

        statusDiv.innerText = 'تم الانتهاء من طباعة جميع ملفات البوكليت بنجاح!';
        printBtn.disabled = false;
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 4000);
    }
</script>

</body>
</html>
