<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اعرف حساب طلبيات الكتب الخارجية | مكتبةمكس_MKTBTmix</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body{
            background: #dde3eb;
            color: #333;
        }
        header{
            background: #16a34a;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,.2);
        }
        .container{
            width: 95%;
            max-width: 1100px;
            margin: auto;
            padding: 20px 0;
        }
        /* حاوية السلايدر مع الأسهم */
        .slider-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .cards-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-top: 15px;     
            padding-bottom: 15px;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            transform: rotateX(180deg);
            width: 100%;
        }
        .cards-container::-webkit-scrollbar {
            height: 10px;
        }
        .cards-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .cards-container > * {
            transform: rotateX(180deg);
        }
        /* تصميم أزرار التمرير (الأسهم) */
        .scroll-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(22, 163, 74, 0.85);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .scroll-btn:hover {
            background: #16a34a;
            transform: translateY(-50%) scale(1.1);
        }
        .scroll-left {
            left: -15px;
        }
        .scroll-right {
            right: -15px;
        }
        @media (max-width: 768px) {
            .scroll-left { left: 5px; }
            .scroll-right { right: 5px; }
        }
        .grade-card {
            background: #fff;
            border-radius: 18px;
            padding: 20px;
            min-width: 300px;
            flex: 0 0 320px;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            box-shadow: 0 10px 25px rgba(0,0,0,.12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .grade-card h3 {
            color: #16a34a;
            font-size: 22px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ccf0d8;
            padding-bottom: 8px;
        }
        .book-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 16px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            transition: background-color 0.25s ease, transform 0.15s ease;
        }
        .book-item.selected-book {
            background: #c9f5d5;
            border: 1px solid #bbf7d0;
        }
        .book-item label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
        }
        .book-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #16a34a;
        }
        .price-tag {
            font-size: 14px;
            color: #555;
            white-space: nowrap;
        }
        .disabled-book {
            color: #999;
            font-size: 14px;
        }
        .summary-card {
            background: #ccf0d8;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,.12);
            text-align: center;
        }
        .summary-flex-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .totals-box {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .total-box-item {
            background: #fff;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,.05);
        }
        .total-box-item span {
            color: #16a34a;
        }
        .footer-note {
            font-size: 16px;
            font-weight: bold;
            color: #d97706;
            margin-top: 15px;
        }
        .footer-note label {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .footer-note input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #d97706;
        }
        #deliveryDetails {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            animation: fadeIn 0.3s ease-in-out;
        }
        .delivery-input {
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #d97706;
            font-size: 15px;
            width: 280px;
            outline: none;
            background: #fff;
            font-family: 'Cairo', sans-serif;
        }
        .action-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #25D366;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            transition: .25s;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            white-space: nowrap;
        }
        .whatsapp-btn:hover {
            transform: translateY(-2px);
            background: #22bf5b;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }
        .print-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #475569;
            color: white;
            padding: 14px 28px;
            border: none;
            text-decoration: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: .25s;
            box-shadow: 0 4px 15px rgba(71, 85, 105, 0.4);
            white-space: nowrap;
            font-family: 'Cairo', sans-serif;
        }
        .print-btn:hover {
            transform: translateY(-2px);
            background: #334155;
            box-shadow: 0 6px 20px rgba(71, 85, 105, 0.6);
        }
        .back{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            transition: .25s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .back:hover {
            transform: translateY(-2px);
            background: #1d4ed8;
        }

        /* تنسيق خاص لصفحة الطباعة الفاتورة الاحترافية */
        @media print {
            @page {
                size: A4;
                margin: 10mm;
            }
            body * {
                visibility: hidden;
            }
            #printableInvoice, #printableInvoice * {
                visibility: visible;
            }
            #printableInvoice {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                padding: 10px;
                direction: rtl;
                font-family: 'Cairo', sans-serif;
                color: #000;
            }
        }
    </style>
</head>
<body>

    <header style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; padding: 15px 20px;">
        <a class="back" href="offers.html" style="margin: 0; width: auto; padding: 8px 15px; font-size: 16px; order: 1;"> 🏠 العودة </a>
        <div style="flex: 1; text-align: center; font-size: clamp(14px, 2.5vw, 22px); font-weight: bold; order: 2; white-space: nowrap;">
            اختار المواد ⬅️ شوف الاجمالى ⬅️ ارسل طلبيتك للواتس أو اطبعها
        </div>
    </header>

    <div class="container">

        <div class="summary-card">
            <div class="summary-flex-container">
                <div class="totals-box">
                    <div class="total-box-item">
                        الإجمالي قبل الخصم: <span id="totalBefore">0.00</span> جنيه
                    </div>
                    <div class="total-box-item">
                        الإجمالي بعد الخصم: <span id="totalAfter">0.00</span> جنيه
                    </div>
                </div>
            </div>
        
            <div class="footer-note">
                <label>
                    <input type="checkbox" id="deliveryCheckbox">
                    متاح التوصيل أو الحجز من خلال المكتبة. يسعدنا زيارتكم!
                </label>
                <div id="deliveryDetails" style="display: none;">
                    <input type="text" id="clientAddress" class="delivery-input" placeholder="اكتب عنوانك بالتفصيل هنا...">
                    <input type="text" id="clientPhone" class="delivery-input" placeholder="اكتب رقم التليفون هنا...">
                </div>
            </div>
        </div>

        <!-- حاوية الكروت مع أزرار الأسهم للتنقل -->
        <div class="slider-wrapper">
            <button class="scroll-btn scroll-right" id="scrollRight">&lt;</button>
            <div class="cards-container" id="cardsContainer">
                <!-- سيتم تعبئة المراحل والكتب تلقائياً من ملف الأكسيل -->
            </div>
            <button class="scroll-btn scroll-left" id="scrollLeft">&gt;</button>
        </div>

        <div class="action-btns">
            <a href="#" id="whatsappSend" class="whatsapp-btn" target="_blank">
                💬 إرسال الطلبية إلى الواتس آب
            </a>
            <button type="button" id="printBtn" class="print-btn">
                🖨️ طباعة الفاتورة
            </button>
            <a class="back" href="offers.html"> 🏠 العودة لباقى العروض </a>  
        </div>

    </div>

    <!-- قالب الفاتورة المخصصة للطباعة المخفية عن الشاشة العادية -->
    <div id="printableInvoice" style="display: none;">
        <!-- السطر الأول: الشعار في المنتصف -->
        <div style="text-align: center; margin-bottom: 10px;">
            <img src="logo.png" alt="شعار المكتبة" style="max-height: 70px; object-fit: contain;">
        </div>

        <!-- السطر الثاني: الوقت والتاريخ على اليمين ومكتبة مكس على اليسار -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #16a34a; padding-bottom: 10px; margin-bottom: 15px; font-size: 13px;">
            <div id="printDate" style="color: #555; font-weight: bold;"></div>
            <div style="color: #16a34a; font-weight: bold;">مكتبة مكس - ش الأوبرج المنصورة 01093393975</div>
        </div>

        <!-- السطر الثالث: مربع إطار بداخله نفس رسالة الواتس اب تماماً -->
        <div style="border: 2px solid #cbd5e1; border-radius: 10px; padding: 12px; margin-bottom: 15px; background: #f8fafc;">
            <div id="printItemsList" style="font-size: 13px; line-height: 1.6; white-space: pre-line;">
                <!-- رسالة الواتس اب بالتفصيل ستظهر هنا -->
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px; font-size: 12px; color: #777; border-top: 1px dashed #ddd; padding-top: 8px;">
            <p>متاح التوصيل أو الحجز من خلال المكتبة. يسعدنا زيارتكم!</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const excelFilePath = "BookClac.xlsx";
        
            fetch(excelFilePath)
                .then(response => response.arrayBuffer())
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    processExcelData(rows);
                })
                .catch(error => console.error("خطأ في قراءة ملف الأكسيل:", error));
        
            const container = document.getElementById('cardsContainer');
            document.getElementById('scrollRight').addEventListener('click', () => {
                container.scrollBy({ left: 340, behavior: 'smooth' });
            });
            document.getElementById('scrollLeft').addEventListener('click', () => {
                container.scrollBy({ left: -340, behavior: 'smooth' });
            });

            document.getElementById('printBtn').addEventListener('click', function() {
                window.print();
            });
        });
        
        function processExcelData(rows) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = "";
        
            let gradesData = {};
        
            for (let i = 1; i < rows.length; i++) {
                let row = rows[i];
                let grade = row[0];       
                let bookName = row[1];    
                let priceBefore = row[2]; 
                let priceAfter = row[3];  
        
                if (!grade || !bookName) continue;
        
                if (!gradesData[grade]) {
                    gradesData[grade] = [];
                }
        
                gradesData[grade].push({
                    name: bookName,
                    price: priceBefore,
                    discounted: priceAfter
                });
            }
        
            for (let grade in gradesData) {
                let cardDiv = document.createElement('div');
                cardDiv.className = 'grade-card';
        
                let innerContent = `<div><h3>${grade}</h3>`;
        
                gradesData[grade].forEach(book => {
                    if (book.price === "ما نزلش" || !book.price) {
                        innerContent += `
                            <div class="book-item">
                                <span style="flex:1;">${book.name}</span>
                                <span class="disabled-book">ما نزلش</span>
                            </div>`;
                    } else {
                        innerContent += `
                            <div class="book-item">
                                <label>
                                    <input type="checkbox" class="book-chk" data-grade="${grade}" data-name="${book.name}" data-price="${book.price}" data-discounted="${book.discounted}">
                                    <span>${book.name}</span>
                                </label>
                                <span class="price-tag">${book.discounted} ج</span>
                            </div>`;
                    }
                });
        
                innerContent += `</div>`;
                cardDiv.innerHTML = innerContent;
                container.appendChild(cardDiv);
            }
        
            initCalculator();
        }
        
        function initCalculator() {
            const checkboxes = document.querySelectorAll('.book-chk');
            const totalBeforeEl = document.getElementById('totalBefore');
            const totalAfterEl = document.getElementById('totalAfter');
            const whatsappSendBtn = document.getElementById('whatsappSend');
            const deliveryCheckbox = document.getElementById('deliveryCheckbox');
            const deliveryDetails = document.getElementById('deliveryDetails');
            const clientAddress = document.getElementById('clientAddress');
            const clientPhone = document.getElementById('clientPhone');

            // عناصر فاتورة الطباعة
            const printItemsList = document.getElementById('printItemsList');
            const printDate = document.getElementById('printDate');
        
            deliveryCheckbox.addEventListener('change', function() {
                if (this.checked) {
                    deliveryDetails.style.display = 'flex';
                } else {
                    deliveryDetails.style.display = 'none';
                    clientAddress.value = '';
                    clientPhone.value = '';
                }
                updateTotals();
            });

            clientAddress.addEventListener('input', updateTotals);
            clientPhone.addEventListener('input', updateTotals);
        
            function updateTotals() {
                let totalBefore = 0;
                let totalAfter = 0;
                let groupedBooks = {};
        
                checkboxes.forEach(chk => {
                    const bookItemDiv = chk.closest('.book-item');
                    if (chk.checked) {
                        bookItemDiv.classList.add('selected-book');
                        totalBefore += parseFloat(chk.dataset.price) || 0;
                        totalAfter += parseFloat(chk.dataset.discounted) || 0;
                        
                        let grade = chk.dataset.grade;
                        if (!groupedBooks[grade]) {
                            groupedBooks[grade] = [];
                        }
                        groupedBooks[grade].push(chk.dataset.name + " (" + chk.dataset.discounted + " جنيه)");
                    } else {
                        bookItemDiv.classList.remove('selected-book');
                    }
                });
        
                totalBeforeEl.textContent = totalBefore.toFixed(2);
                totalAfterEl.textContent = totalAfter.toFixed(2);

                const now = new Date();
                printDate.textContent = now.toLocaleDateString('ar-EG') + " - " + now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        
                let message = "مرحباً، أرغب في حجز الكتب التالية من مكتبةمكس_MKTBTmix:\n";
                
                for (let grade in groupedBooks) {
                    message += "\n📌 *" + grade + "*:\n";
                    groupedBooks[grade].forEach((book, index) => {
                        message += (index + 1) + "- " + book + "\n";
                    });
                }

                message += "\nإجمالي السعر قبل الخصم: " + totalBefore.toFixed(2) + " جنيه";
                message += "\nإجمالي السعر بعد الخصم: " + totalAfter.toFixed(2) + " جنيه";

                if (deliveryCheckbox.checked) {
                    message += "\n\n🚚 *طلب توصيل للمنزل*:";
                    message += "\n📍 العنوان: " + (clientAddress.value ? clientAddress.value : "لم يكتب");
                    message += "\n📞 التليفون: " + (clientPhone.value ? clientPhone.value : "لم يكتب");
                }

                message += "\n\nمتاح التوصيل أو الحجز من خلال المكتبة. يسعدنا زيارتكم!";
        
                // عرض نص رسالة الواتس اب داخل قالب الطباعة بالكامل
                printItemsList.textContent = message;

                // ترميز الرسالة للرابط
                let encodedMessage = encodeURIComponent(message).replace(/%0A/g, '%0A');
                whatsappSendBtn.href = "https://wa.me/201093393975?text=" + encodedMessage;
            }
        
            checkboxes.forEach(chk => {
                chk.addEventListener('change', updateTotals);
            });
        }
    </script>
</body>
</html>
