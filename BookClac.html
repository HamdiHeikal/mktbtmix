<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اعرف حساب طلبيات الكتب الخارجية | مكتبةمكس_MKTBTmix</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body{
            background: #dde3eb;
            color: #333;
        }
        header{
            background: #16a34a;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,.2);
        }
        .container{
            width: 95%;
            max-width: 1100px;
            margin: auto;
            padding: 20px 0;
        }
        .main-banner{
            background: #fff;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #16a34a;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,.12);
            line-height: 1.8;
        }
        /* حاوية السلايدر مع الأسهم */
        .slider-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .cards-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-top: 15px;     
            padding-bottom: 15px;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch; /* لتحسين نعومة السحب على الأجهزة الذكية وبطئها الطبيعي */
            transform: rotateX(180deg);
            width: 100%;
        }
        .cards-container::-webkit-scrollbar {
            height: 10px;
        }
        .cards-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .cards-container > * {
            transform: rotateX(180deg);
        }
        /* تصميم أزرار التمرير (الأسهم) - تم نقلها للأعلى قريبة من أسماء الصفوف */
        .scroll-btn {
            position: absolute;
            top: 35px; /* رفعناها للأعلى لتكون قريبة من عنوان الصف الدراسي */
            background: rgba(22, 163, 74, 0.85);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .scroll-btn:hover {
            background: #16a34a;
            transform: scale(1.1);
        }
        .scroll-left {
            left: 10px;
        }
        .scroll-right {
            right: 10px;
        }
        .grade-card {
            background: #fff;
            border-radius: 18px;
            padding: 20px;
            min-width: 300px;
            flex: 0 0 320px;
            scroll-snap-align: start;
            scroll-snap-stop: always; /* تجبر السحب على الانتقال كارت بكارت ببطء وتوازن */
            box-shadow: 0 10px 25px rgba(0,0,0,.12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .grade-card h3 {
            color: #16a34a;
            font-size: 22px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ccf0d8;
            padding-bottom: 8px;
        }
        .book-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 16px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            transition: background-color 0.25s ease, transform 0.15s ease;
        }
        /* التنسيق عند اختيار الكتاب (تظليل بلون خفيف وحلو) */
        .book-item.selected-book {
            background: #c9f5d5;
            border: 1px solid #bbf7d0;
        }
        .book-item label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
        }
        .book-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #16a34a;
        }
        .price-tag {
            font-size: 14px;
            color: #555;
            white-space: nowrap;
        }
        .disabled-book {
            color: #999;
            font-size: 14px;
        }
        .summary-card {
            background: #ccf0d8;
            border-radius: 18px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,.12);
            text-align: center;
        }
        .summary-flex-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            direction: ltr;
        }
        .totals-box {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            direction: rtl;
        }
        .total-box-item {
            background: #fff;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,.05);
        }
        .total-box-item span {
            color: #16a34a;
        }
        .footer-note {
            font-size: 16px;
            font-weight: bold;
            color: #d97706;
            margin-top: 15px;
        }
        .footer-note label {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .footer-note input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #d97706;
        }
        #deliveryDetails {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            animation: fadeIn 0.3s ease-in-out;
        }
        .delivery-input {
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #d97706;
            font-size: 15px;
            width: 280px;
            outline: none;
            background: #fff;
            font-family: 'Cairo', sans-serif;
        }
        .whatsapp-btn {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            transition: .25s;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            white-space: nowrap;
            direction: rtl;
        }
        .whatsapp-btn:hover {
            transform: scale(1.05);
        }
        .back{
            display: block;
            width: 240px;
            margin: 20px auto 0;
            text-align: center;
            padding: 12px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <header style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; padding: 15px 20px;">
        <a class="back" href="offers.html" style="margin: 0; width: auto; padding: 8px 15px; font-size: 16px; order: 1;"> 🏠 العودة </a>
        <div style="flex: 1; text-align: center; font-size: clamp(14px, 2.5vw, 22px); font-weight: bold; order: 2; white-space: nowrap;">
            اختار المواد ⬅️ شوف الاجمالى ⬅️ ارسل طلبيتك للواتس
        </div>
    </header>

    <div class="container">

        <div class="summary-card">
            <div class="summary-flex-container" style="display: flex; flex-wrap: nowrap; align-items: center; justify-content: space-between; gap: 10px; width: 100%;">
                <a href="#" id="whatsappSend" class="whatsapp-btn" target="_blank" style="flex: 1; min-width: 0; padding: 10px 5px; font-size: clamp(12px, 3vw, 16px); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    💬 ارسل للواتس
                </a>
                <div class="total-box-item" style="flex: 1; min-width: 0; padding: 10px 5px; font-size: clamp(11px, 2.8vw, 15px); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    الإجمالي: <span id="totalBefore">0.00</span> (بالخصم: <span id="totalAfter">0.00</span> ج)
                </div>
            </div>
        
            <div class="footer-note">
                <label>
                    <input type="checkbox" id="deliveryCheckbox">
                    متاح التوصيل أو الحجز من خلال المكتبة. يسعدنا زيارتكم!
                </label>
                <div id="deliveryDetails" style="display: none;">
                    <input type="text" id="clientAddress" class="delivery-input" placeholder="اكتب عنوانك بالتفصيل هنا...">
                    <input type="text" id="clientPhone" class="delivery-input" placeholder="اكتب رقم التليفون هنا...">
                </div>
            </div>
        </div>

        <!-- حاوية الكروت مع أزرار الأسهم للتنقل -->
        <div class="slider-wrapper">
            <button class="scroll-btn scroll-right" id="scrollRight">&lt;</button>
            <div class="cards-container" id="cardsContainer">
                <!-- سيتم تعبئة المراحل والكتب تلقائياً من ملف الأكسيل -->
            </div>
            <button class="scroll-btn scroll-left" id="scrollLeft">&gt;</button>
        </div>

        <a class="back" href="offers.html"> 🏠 العودة لباقى العروض </a>
        <button class="back" id="printInvoiceBtn"
                style="background:#16a34a;display:inline-block;width:auto;margin-right:10px;">
            🖨️ طباعة فاتورة
        </button>
        
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const excelFilePath = "BookClac.xlsx";
        
            fetch(excelFilePath)
                .then(response => response.arrayBuffer())
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    processExcelData(rows);
                })
                .catch(error => console.error("خطأ في قراءة ملف الأكسيل:", error));
        
            // تفعيل أزرار التمرير (الأسهم)
            const container = document.getElementById('cardsContainer');
            document.getElementById('scrollRight').addEventListener('click', () => {
                container.scrollBy({ left: 340, behavior: 'smooth' });
            });
            document.getElementById('scrollLeft').addEventListener('click', () => {
                container.scrollBy({ left: -340, behavior: 'smooth' });
            });
        });
        
        function processExcelData(rows) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = "";
        
            let gradesData = {};
        
            for (let i = 1; i < rows.length; i++) {
                let row = rows[i];
                let grade = row[0];       
                let bookName = row[1];    
                let priceBefore = row[2]; 
                let priceAfter = row[3];  
        
                if (!grade || !bookName) continue;
        
                if (!gradesData[grade]) {
                    gradesData[grade] = [];
                }
        
                gradesData[grade].push({
                    name: bookName,
                    price: priceBefore,
                    discounted: priceAfter
                });
            }
        
            for (let grade in gradesData) {
                let cardDiv = document.createElement('div');
                cardDiv.className = 'grade-card';
        
                let innerContent = `<div><h3>${grade}</h3>`;
        
                gradesData[grade].forEach(book => {
                    if (book.price === "ما نزلش" || !book.price) {
                        innerContent += `
                            <div class="book-item">
                                <span style="flex:1;">${book.name}</span>
                                <span class="disabled-book">ما نزلش</span>
                            </div>`;
                    } else {
                        innerContent += `
                            <div class="book-item">
                                <label>
                                    <input type="checkbox" class="book-chk" data-grade="${grade}" data-name="${book.name}" data-price="${book.price}" data-discounted="${book.discounted}">
                                    <span>${book.name}</span>
                                </label>
                                <span class="price-tag">${book.discounted} ج</span>
                            </div>`;
                    }
                });
        
                innerContent += `</div>`;
                cardDiv.innerHTML = innerContent;
                container.appendChild(cardDiv);
            }
        
            initCalculator();
        }
        
        function initCalculator() {
            const checkboxes = document.querySelectorAll('.book-chk');
            const totalBeforeEl = document.getElementById('totalBefore');
            const totalAfterEl = document.getElementById('totalAfter');
            const whatsappSendBtn = document.getElementById('whatsappSend');
            const deliveryCheckbox = document.getElementById('deliveryCheckbox');
            const deliveryDetails = document.getElementById('deliveryDetails');
            const clientAddress = document.getElementById('clientAddress');
            const clientPhone = document.getElementById('clientPhone');
        
            deliveryCheckbox.addEventListener('change', function() {
                if (this.checked) {
                    deliveryDetails.style.display = 'flex';
                } else {
                    deliveryDetails.style.display = 'none';
                    clientAddress.value = '';
                    clientPhone.value = '';
                }
                updateTotals();
            });

            clientAddress.addEventListener('input', updateTotals);
            clientPhone.addEventListener('input', updateTotals);
        
            function updateTotals() {
                let totalBefore = 0;
                let totalAfter = 0;
                let groupedBooks = {};
        
                checkboxes.forEach(chk => {
                    const bookItemDiv = chk.closest('.book-item');
                    if (chk.checked) {
                        bookItemDiv.classList.add('selected-book');
                        totalBefore += parseFloat(chk.dataset.price) || 0;
                        totalAfter += parseFloat(chk.dataset.discounted) || 0;
                        
                        let grade = chk.dataset.grade;
                        if (!groupedBooks[grade]) {
                            groupedBooks[grade] = [];
                        }
                        groupedBooks[grade].push(chk.dataset.name + " (" + chk.dataset.discounted + " جنيه)");
                    } else {
                        bookItemDiv.classList.remove('selected-book');
                    }
                });
        
                totalBeforeEl.textContent = totalBefore.toFixed(2);
                totalAfterEl.textContent = totalAfter.toFixed(2);
        
                let message = "📚 *طلب حجز كتب خارجية*%0A";
                
                for (let grade in groupedBooks) {
                    message += "%0A📌 *" + grade + "*:%0A";
                    groupedBooks[grade].forEach((book, index) => {
                        message += (index + 1) + "- " + book + "%0A";
                    });
                }

                message += "%0Aإجمالي السعر قبل الخصم: " + totalBefore.toFixed(2) + " جنيه";
                message += "%0Aإجمالي السعر بعد الخصم: " + totalAfter.toFixed(2) + " جنيه";

                if (deliveryCheckbox.checked) {
                    message += "%0A%0A🚚 *طلب توصيل للمنزل*:";
                    message += "%0A📍 العنوان: " + (clientAddress.value ? clientAddress.value : "لم يكتب");
                    message += "%0A📞 التليفون: " + (clientPhone.value ? clientPhone.value : "لم يكتب");
                }

                message += "%0A%0Aمتاح التوصيل أو الحجز من خلال المكتبة. يسعدنا زيارتكم!";
                document.getElementById("printInvoiceBtn").onclick=function(){
                    printInvoice(message);
                };        
                whatsappSendBtn.href = "https://wa.me/201093393975?text=" + message;
            }
        
            checkboxes.forEach(chk => {
                chk.addEventListener('change', updateTotals);
            });
        }
        
        function printInvoice(message){
        
            const now=new Date();
        
            const date=
                now.toLocaleDateString('ar-EG')+
                " "+
                now.toLocaleTimeString('ar-EG',{
                    hour:'2-digit',
                    minute:'2-digit'
                });
        
            document.getElementById("invoiceHeader").innerHTML=
                date+
                " &nbsp;&nbsp;&nbsp; مكتبة مكس - ش الأوبرج - 01093393975";
        
            document.getElementById("invoiceText").textContent=
                decodeURIComponent(message);
        
            const w=window.open("","","width=800,height=900");
        
            w.document.write(`
            <html dir="rtl">
            <head>
                <title>فاتورة</title>
        
                <style>
        
                    body{
                        font-family:Cairo,sans-serif;
                        padding:25px;
                        direction:rtl;
                    }
        
                    img{
                        width:120px;
                    }
        
                    pre{
                        white-space:pre-wrap;
                        font-size:18px;
                        line-height:1.8;
                    }
        
                </style>
        
            </head>
        
            <body>
        
                ${document.getElementById("invoiceArea").innerHTML}
        
            </body>
        
            </html>
            `);
        
            w.document.close();
        
            w.focus();
        
            setTimeout(()=>{
                w.print();
                w.close();
            },300);
        
        }
        
        
    </script>
<div id="invoiceArea" style="display:none">
    <div style="text-align:center">
        <img src="logo.png" style="width:120px;margin-bottom:10px;">
        <div id="invoiceHeader"
             style="font-weight:bold;font-size:18px;margin-bottom:15px;">
        </div>
    </div>
    <pre id="invoiceText"
         style="
            font-family:'Cairo',sans-serif;
            font-size:18px;
            white-space:pre-wrap;
            line-height:1.8;
         ">
    </pre>
</div>
    
</body>
</html>
