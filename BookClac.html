<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اعرف حساب طلبيات الكتب الخارجية | مكتبةمكس_MKTBTmix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #dde3eb;
            color: #333;
            overflow-x: hidden;
        }
        header {
            background: #16a34a;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,.2);
        }
        .container {
            width: 95%;
            max-width: 1100px;
            margin: auto;
            padding: 20px 0;
        }
        .slider-wrapper { display: flex; flex-direction: column; } 
        .cards-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-top: 15px;    
            padding-bottom: 15px;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            direction: rtl;
             order: 1;
        }
        .cards-container::-webkit-scrollbar {
            height: 10px;
        }
        .cards-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .cards-container > * {
            scroll-snap-align: start;
        }
        .scroll-btn {
            position: absolute;
            top: 75px;
            background: rgba(22, 163, 74, 0.85);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .scroll-btn:hover {
            background: #16a34a;
            transform: scale(1.1);
        }
        .scroll-left {
            left: 10px;
        }
        .scroll-right {
            right: 10px;
        }
        .grade-card {
            background: #fff;
            border-radius: 18px;
            padding: 20px;
            min-width: 300px;
            flex: 0 0 320px;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            box-shadow: 0 10px 25px rgba(0,0,0,.12);
            display: flex;
            flex-direction: column;
            max-height: 520px;
            overflow-y: auto;
            position: relative;
        }
        .grade-card::-webkit-scrollbar {
            width: 6px;
        }
        .grade-card::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .grade-card h3 {
            color: #16a34a;
            font-size: 22px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ccf0d8;
            padding-bottom: 8px;
            position: sticky;
            top: -20px;
            background: #fff;
            z-index: 5;
        }
        .book-item {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
            font-size: 16px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            gap: 8px;
            transition: background-color 0.25s ease, transform 0.15s ease;
        }
        .book-item.selected-book {
            background: #c9f5d5;
            border: 1px solid #bbf7d0;
        }
        .book-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .book-item label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
            color: #111827;
            font-weight: 700;
        }
        .book-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #16a34a;
        }
        .price-tag {
            font-size: 14px;
            color: #555;
            white-space: nowrap;
        }
        .book-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 6px;
        }
        .qty-btn {
            background: #16a34a;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .qty-btn:hover {
            background: #15803d;
        }
        .qty-display {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        .disabled-book { 
            color: #e11d48; font-weight: 700; font-size: 16px; background: #ffe4e6; padding: 4px 10px; border-radius: 6px; 
        }
        .summary-card {
            background: #ccf0d8;
            border-radius: 18px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,.12);
            text-align: center;
        }
        .summary-flex-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
            direction: ltr;
        }
        .totals-box {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            direction: rtl;
        }
        .total-box-item {
            background: #fff;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,.05);
        }
        .total-box-item span {
            color: #16a34a;
        }
        .footer-note {
            font-size: 16px;
            font-weight: bold;
            color: #d97706;
            margin-top: 15px;
        }
        .footer-note label {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .footer-note input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #d97706;
        }
        #deliveryDetails {
            margin-top: 15px;
            display: none;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .delivery-input {
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #d97706;
            font-size: 15px;
            width: 280px;
            outline: none;
            background: #fff;
            font-family: 'Cairo', sans-serif;
        }
        @keyframes pulse-zoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.30); }
            100% { transform: scale(1); }
        }
        .whatsapp-pulse {
            animation: pulse-zoom 1.5s infinite ease-in-out;
            display: inline-block;
        }
        .whatsapp-pulse:hover {
            animation-play-state: paused;
            transform: scale(1.12);
        }
        .whatsapp-btn {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            transition: .25s;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            white-space: nowrap;
            direction: rtl;
        }
        @keyframes truck-drive {
            0% { transform: translateX(240px); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .animated-truck {
            display: inline-block;
            font-size: 2em; 
            animation: truck-drive 6s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
        }
        .back {
            display: block;
            width: 240px;
            margin: 20px auto 0;
            text-align: center;
            padding: 12px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; padding: 15px 20px;">
        <div style="flex: 2 1 auto; min-width: 0; padding: 10px 5px; text-align: center; font-size: clamp(14px, 2.5vw, 22px); font-weight: bold; order: 2; white-space: nowrap;">
            اختار المواد⬅️ الاجمالى (خصم 15%)⬅️ ارسل للواتس
        </div>
    </header>

    <div class="container">

        <div class="summary-card">
            <div class="summary-flex-container">
                <a href="#" id="whatsappSend" class="whatsapp-btn whatsapp-pulse" target="_blank" style="flex: 0 1 auto; min-width: 90px; padding: 10px 8px; font-size: clamp(10px, 2.5vw, 15px); text-align: center; text-overflow: ellipsis;">
                    💬 ارسل للواتس
                </a>
                <div class="total-box-item" style="flex: 2 1 auto; min-width: 0; padding: 10px 5px; font-size: clamp(11px, 2.5vw, 15px); text-align: center;">
                    الإجمالي: <span id="totalBefore">0.00</span> (بالخصم: <span id="totalAfter">0.00</span> ج)
                </div>
            </div>
        
            <div class="footer-note">
                <label>
                    <span class="truck-container">
                        لو حابب التوصيل، فعّل هذا الخيار. <span class="animated-truck">🚚</span>
                    </span>
                    <input type="checkbox" id="deliveryCheckbox">
                </label>
                <div id="deliveryDetails">
                    <input type="text" id="clientAddress" class="delivery-input" placeholder="اكتب عنوانك بالتفصيل هنا...">
                    <input type="text" id="clientPhone" class="delivery-input" placeholder="اكتب رقم التليفون هنا...">
                </div>
            </div>
        </div>

        <div class="slider-wrapper">
            <button class="scroll-btn scroll-right" id="scrollRight">&lt;</button>
            <div class="cards-container" id="cardsContainer">
                <!-- سيتم تعبئة المراحل والكتب تلقائياً بأمان من ملف الأكسيل -->
            </div>
            <button class="scroll-btn scroll-left" id="scrollLeft">&gt;</button>
        </div>

        <a class="back" href="offers.html"> 🏠 العودة لباقى العروض </a>
        <button class="back" id="printInvoiceBtn" style="background:#16a34a;display:inline-block;width:auto;margin-right:10px;cursor:pointer;">
            🖨️ طباعة فاتورة
        </button>

        <div style="margin-top: 20px; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px;">
                <h4 style="color: #16a34a; font-size: 18px; margin: 0;">📄 معاينة نص الرسالة (التي ستُرسل للواتساب والفاتورة):</h4>
                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <input type="text" id="friendPhone" placeholder="رقم هاتف الصديق..." style="padding: 6px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; font-family: 'Cairo', sans-serif; width: 160px;">
                    <a href="#" id="shareFriendBtn" target="_blank" style="background: #25D366; color: white; padding: 6px 14px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: bold; white-space: nowrap; box-shadow: 0 2px 8px rgba(37,211,102,0.3);">
                        📤 مشاركة للصديق
                    </a>
                </div>
            </div>
            <div id="messagePreview" style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: 'Cairo', sans-serif; font-size: 16px; white-space: pre-wrap; line-height: 1.8; text-align: right;">
                لم يتم اختيار أي كتب بعد...
            </div>
        </div>
        
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const excelFilePath = "BookClac.xlsx";
        
            fetch(excelFilePath)
                .then(response => response.arrayBuffer())
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    processExcelData(rows);
                })
                .catch(error => console.error("خطأ في قراءة ملف الأكسيل:", error));
        
            const container = document.getElementById('cardsContainer');
            document.getElementById('scrollRight').addEventListener('click', () => {
                container.scrollBy({ left: 340, behavior: 'smooth' });
            });
            document.getElementById('scrollLeft').addEventListener('click', () => {
                container.scrollBy({ left: -340, behavior: 'smooth' });
            });
        });

        function parsePrice(v) {
            if (v == null) return NaN;
            if (typeof v === 'number') return Number(v);
            const strVal = String(v).trim();
            if (strVal === 'لسة منزلش' || strVal === 'ما نزلش' || strVal === '' || strVal === '0' || strVal === '0.0' || strVal === '0.00') return NaN;
            const s = strVal.replace(/[^\d.,-]/g, '').replace(',', '.');
            const n = parseFloat(s);
            return Number.isFinite(n) && n > 0 ? n : NaN;
        }

        function formatCurrency(n) {
            if (!Number.isFinite(n)) return String(n);
            return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        
        function processExcelData(rows) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = "";
            const fragment = document.createDocumentFragment();
            let gradesData = {};
        
            for (let i = 1; i < rows.length; i++) {
                let row = rows[i] || [];
                let grade = String(row[0] ?? '').trim();        
                let bookName = String(row[1] ?? '').trim();    
                let priceBeforeRaw = row[2]; 
                let priceAfterRaw = row[3];  
        
                if (!grade || !bookName) continue;

                let priceBefore = parsePrice(priceBeforeRaw);
                let priceAfter = parsePrice(priceAfterRaw);
        
                if (!gradesData[grade]) {
                    gradesData[grade] = [];
                }
        
                gradesData[grade].push({
                    name: bookName,
                    priceBefore,
                    priceAfter,
                    rawPriceBefore: priceBeforeRaw,
                    rawPriceAfter: priceAfterRaw
                });
            }
        
            Object.keys(gradesData).forEach(grade => {
                let cardDiv = document.createElement('div');
                cardDiv.className = 'grade-card';

                let h3 = document.createElement('h3');
                h3.textContent = grade;
                cardDiv.appendChild(h3);
        
                gradesData[grade].forEach(book => {
                    let item = document.createElement('div');
                    item.className = 'book-item';

                    let top = document.createElement('div');
                    top.className = 'book-row-top';

                    let rawBeforeStr = String(book.rawPriceBefore ?? '').trim();
                    let isUnreleased = !Number.isFinite(book.priceBefore) || rawBeforeStr === '0' || rawBeforeStr === '0.0' || rawBeforeStr === '0.00' || rawBeforeStr === 'لسة منزلش' || rawBeforeStr === 'ما نزلش';

                    if (isUnreleased) {
                        let nameSpan = document.createElement('span');
                        nameSpan.style.flex = '1';
                        nameSpan.style.fontWeight = '700';
                        nameSpan.style.color = '#111827';
                        nameSpan.textContent = book.name;

                        let noSpan = document.createElement('span');
                        noSpan.className = 'disabled-book';
                        noSpan.textContent = 'مانزلش';

                        top.appendChild(nameSpan);
                        top.appendChild(noSpan);
                        item.appendChild(top);
                        cardDiv.appendChild(item);
                        return;
                    }

                    let label = document.createElement('label');
                    let checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'book-chk';
                    checkbox.dataset.grade = grade;
                    checkbox.dataset.name = book.name;
                    checkbox.dataset.price = String(book.priceBefore);
                    checkbox.dataset.discounted = String(book.priceAfter);

                    let nameSpan = document.createElement('span');
                    nameSpan.textContent = book.name;

                    label.appendChild(checkbox);
                    label.appendChild(nameSpan);

                    let priceTag = document.createElement('span');
                    priceTag.className = 'price-tag';
                    priceTag.textContent = Number.isFinite(book.priceAfter) ? formatCurrency(book.priceAfter) + ' ج' : String(book.rawPriceAfter);

                    top.appendChild(label);
                    top.appendChild(priceTag);

                    let controls = document.createElement('div');
                    controls.className = 'book-controls';

                    let minus = document.createElement('button');
                    minus.type = 'button';
                    minus.className = 'qty-btn minus-btn';
                    minus.textContent = '-';

                    let qty = document.createElement('span');
                    qty.className = 'qty-display';
                    qty.textContent = '1';

                    let plus = document.createElement('button');
                    plus.type = 'button';
                    plus.className = 'qty-btn plus-btn';
                    plus.textContent = '+';

                    controls.appendChild(minus);
                    controls.appendChild(qty);
                    controls.appendChild(plus);

                    item.appendChild(top);
                    item.appendChild(controls);
                    cardDiv.appendChild(item);
                });

                fragment.appendChild(cardDiv);
            });

            container.appendChild(fragment);
            initCalculator();
        }
        
        function initCalculator() {
            const container = document.getElementById('cardsContainer');
            const totalBeforeEl = document.getElementById('totalBefore');
            const totalAfterEl = document.getElementById('totalAfter');
            const whatsappSendBtn = document.getElementById('whatsappSend');
            const deliveryCheckbox = document.getElementById('deliveryCheckbox');
            const deliveryDetails = document.getElementById('deliveryDetails');
            const clientAddress = document.getElementById('clientAddress');
            const clientPhone = document.getElementById('clientPhone');
            const messagePreview = document.getElementById('messagePreview');
            const friendPhoneInput = document.getElementById('friendPhone');
            const shareFriendBtn = document.getElementById('shareFriendBtn');
        
            deliveryCheckbox.addEventListener('change', function() {
                if (this.checked) {
                    deliveryDetails.style.display = 'flex';
                } else {
                    deliveryDetails.style.display = 'none';
                    clientAddress.value = '';
                    clientPhone.value = '';
                }
                updateTotals();
            });

            clientAddress.addEventListener('input', updateTotals);
            clientPhone.addEventListener('input', updateTotals);
            friendPhoneInput.addEventListener('input', updateTotals);

            container.addEventListener('click', (e) => {
                const btn = e.target.closest('.qty-btn');
                if (btn) {
                    e.preventDefault();
                    const item = btn.closest('.book-item');
                    const qtyEl = item.querySelector('.qty-display');
                    let qty = parseInt(qtyEl.textContent, 10) || 1;
                    
                    if (btn.classList.contains('plus-btn')) qty++;
                    if (btn.classList.contains('minus-btn')) qty = Math.max(1, qty - 1);
                    
                    qtyEl.textContent = qty;
                    updateTotals();
                    return;
                }
            });

            container.addEventListener('change', (e) => {
                const chk = e.target.closest('.book-chk');
                if (chk) {
                    const bookItem = chk.closest('.book-item');
                    bookItem.classList.toggle('selected-book', chk.checked);
                    updateTotals();
                }
            });

            function updateTotals() {
                const checkboxes = container.querySelectorAll('.book-chk');
                let totalBefore = 0;
                let totalAfter = 0;
                let groupedBooks = {};

                checkboxes.forEach(chk => {
                    const item = chk.closest('.book-item');
                    if (!chk.checked) {
                        item.classList.remove('selected-book');
                        return;
                    }
                    
                    item.classList.add('selected-book');
                    const qty = parseInt(item.querySelector('.qty-display').textContent, 10) || 1;
                    const priceBefore = parsePrice(chk.dataset.price);
                    const priceAfter = parsePrice(chk.dataset.discounted);
                    const grade = chk.dataset.grade;
                    const bookName = chk.dataset.name;

                    if (Number.isFinite(priceBefore)) totalBefore += priceBefore * qty;
                    if (Number.isFinite(priceAfter)) totalAfter += priceAfter * qty;

                    if (!groupedBooks[grade]) groupedBooks[grade] = [];
                    groupedBooks[grade].push({ name: bookName, qty, price: priceAfter });
                });

                if (totalBeforeEl) totalBeforeEl.textContent = formatCurrency(totalBefore);
                if (totalAfterEl) totalAfterEl.textContent = formatCurrency(totalAfter);

                let message = "📚 *طلب كتب خارجية من مكتبةمكس_MKTBTmix* 📚\n\n";
                let hasItems = false;

                for (let grade in groupedBooks) {
                    hasItems = true;
                    message += `📌 *${grade}*:\n`;
                    groupedBooks[grade].forEach(b => {
                        message += `▫️ ${b.name} (عدد: ${b.qty}) - ${formatCurrency(b.price * b.qty)} ج\n`;
                    });
                    message += "\n";
                }

                if (hasItems) {
                    message += `💰 *الإجمالي قبل الخصم:* ${formatCurrency(totalBefore)} ج\n`;
                    message += `🎁 *الإجمالي بعد خصم 15%:* ${formatCurrency(totalAfter)} ج\n`;

                    if (deliveryCheckbox && deliveryCheckbox.checked) {
                        message += `\n🚚 *خدمة التوصيل مفعلة*\n`;
                        if (clientAddress && clientAddress.value.trim()) message += `📍 العنوان: ${clientAddress.value.trim()}\n`;
                        if (clientPhone && clientPhone.value.trim()) message += `📞 الهاتف: ${clientPhone.value.trim()}\n`;
                    }

                    message += "\n--------------------------\n";
                    message += "📚 *موقع خاص بمكتبة مكس* 📚\n";
                    message += "اطلب كتبك فى 3 خطوات بسيطة:\n";
                    message += "1- ادخل على الرابط.  2- اختار الكتب اللى محتاجها.  3- اضغط (إرسال لواتس المكتبة).\n";
                    message += "https://hamdiheikal.github.io/mktbtmix/BookClac.html\n";
                    message += "💻 برمجتى الشخصية وتحت أمركم فى اقتراحات التطوير. | ⭐ أسهل / أسرع / ومعرفة اللى لسه منزلتش.\n";
                    message += "🌹 *مستنى تجربتكم وتشجيعكم* 🌹";
                } else {
                    message = "لم يتم اختيار أي كتب بعد...";
                }

                if (messagePreview) messagePreview.textContent = message;

                if (whatsappSendBtn) {
                    whatsappSendBtn.target = '_blank';
                    whatsappSendBtn.rel = 'noopener noreferrer';
                    
                    if (hasItems) {
                        const encodedMessage = encodeURIComponent(message);
                        whatsappSendBtn.href = `https://wa.me/201093393975?text=${encodedMessage}`;
                        whatsappSendBtn.classList.remove('disabled');
                        whatsappSendBtn.removeAttribute('aria-disabled');
                        whatsappSendBtn.style.opacity = "1";
                        whatsappSendBtn.style.pointerEvents = "auto";
                    } else {
                        whatsappSendBtn.removeAttribute('href');
                        whatsappSendBtn.classList.add('disabled');
                        whatsappSendBtn.setAttribute('aria-disabled', 'true');
                        whatsappSendBtn.style.opacity = "0.6";
                        whatsappSendBtn.style.pointerEvents = "none";
                    }
                }

                if (shareFriendBtn && friendPhoneInput) {
                    shareFriendBtn.target = '_blank';
                    shareFriendBtn.rel = 'noopener noreferrer';

                    const rawFriendPhone = friendPhoneInput.value.trim();
                    if (hasItems && rawFriendPhone) {
                        const normalizedPhone = rawFriendPhone.replace(/\D/g, '');
                        const encodedMessage = encodeURIComponent(message);
                        shareFriendBtn.href = `https://wa.me/${normalizedPhone}?text=${encodedMessage}`;
                        shareFriendBtn.style.opacity = "1";
                        shareFriendBtn.style.pointerEvents = "auto";
                    } else {
                        shareFriendBtn.href = "#";
                        shareFriendBtn.style.opacity = "0.6";
                        shareFriendBtn.style.pointerEvents = "none";
                    }
                }
            }

            const printInvoiceBtn = document.getElementById('printInvoiceBtn');
            if (printInvoiceBtn) {
                printInvoiceBtn.onclick = function() {
                    window.print();
                };
            }
        }
    </script>
</body>
</html>
